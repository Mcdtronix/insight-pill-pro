# -----------------------------------------------------------------------------
# PharmInsight deployment settings — the only per-app values the scripts use.
# Sourced by deploy/scripts/lib.sh and deploy/server/bootstrap-pharminsight.sh.
#
# Port plan on the shared VPS:
#   portfolio  Gunicorn 8001, pre-flight 8091
#   pms        Gunicorn 8002 (reserved)
#   pharminsight  Gunicorn 8003, pre-flight 8093 · Node SSR 3003, pre-flight 3093
# -----------------------------------------------------------------------------
# shellcheck disable=SC2034  # consumed by the scripts that source this file

APP_NAME="pharminsight"
DOMAIN="pharminsight.mcdtronix.co.zw"

API_SERVICE="pharminsight-api"           # Django + Gunicorn (systemd unit)
WEB_SERVICE="pharminsight-web"           # TanStack Start SSR on Node (systemd unit)

APP_ROOT="/srv/apps/pharminsight"        # releases/, shared/, venvs/, current ->
BACKUP_ROOT="/var/backups/apps/pharminsight"

API_PORT=8003
API_PREFLIGHT_PORT=8093                  # throwaway Gunicorn that tests a release before go-live
WEB_PORT=3003
WEB_PREFLIGHT_PORT=3093                  # throwaway Node server for the same purpose

KEEP_RELEASES=5                          # releases kept on disk for instant rollback
BACKUP_RETENTION_DAYS=14

HEALTH_PATH="/api/health/"               # 200 only when the database and model files are OK
# Must answer 401 to an anonymous request: proves routing + JWT auth are wired.
AUTH_GUARD_PATH="/api/dashboard/kpis/"
# Server-rendered pages that must answer 200 with HTML.
PAGE_PATHS="/login /dashboard /model-lab"
