# -----------------------------------------------------------------------------
# pharminsight.mcdtronix.co.zw — PharmInsight IDSS
#   /assets/          hashed JS/CSS, served by Nginx straight from the release
#   /api/, /admin/    Django REST API on Gunicorn  (127.0.0.1:8003)
#   /static/          Django admin static files (collected per release)
#   everything else   TanStack Start SSR on Node   (127.0.0.1:3003)
#
# Source of truth: deploy/nginx/ in the insight-pill-pro repo.
# Installed by deploy/server/bootstrap-pharminsight.sh
# -----------------------------------------------------------------------------

upstream pharminsight_api {
    server 127.0.0.1:8003;
    keepalive 16;
}

upstream pharminsight_web {
    server 127.0.0.1:3003;
    keepalive 16;
}

# Brute-force guard in front of Django's own 10/min login throttle.
limit_req_zone $binary_remote_addr zone=pharminsight_login:10m rate=20r/m;

# HTTP: ACME challenges for renewals, everything else -> HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name pharminsight.mcdtronix.co.zw;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://pharminsight.mcdtronix.co.zw$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pharminsight.mcdtronix.co.zw;

    ssl_certificate     /etc/letsencrypt/live/pharminsight.mcdtronix.co.zw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pharminsight.mcdtronix.co.zw/privkey.pem;
    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;

    access_log /var/log/nginx/pharminsight.access.log;
    error_log  /var/log/nginx/pharminsight.error.log warn;

    # `current` is a symlink swapped atomically on each deploy.
    root /srv/apps/pharminsight/current/web/public;

    # Reports export as CSV/PDF; requests themselves are small JSON.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml font/woff2;

    # Vite output is content-hashed: cache forever.
    location /assets/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /api/auth/login/ {
        limit_req zone=pharminsight_login burst=10 nodelay;
        limit_req_status 429;
        include snippets/pharminsight-api-proxy.conf;
    }

    # The decision engine and Model Lab re-tests can take several seconds.
    location /api/ {
        include snippets/pharminsight-api-proxy.conf;
    }

    location /admin/ {
        include snippets/pharminsight-api-proxy.conf;
    }

    # Django admin CSS/JS — collected per release.
    location /static/ {
        alias /srv/apps/pharminsight/current/backend/staticfiles/;
        expires 7d;
        access_log off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # Pages: server-rendered by Node. favicon/robots come from public/ when present.
    location / {
        try_files $uri @web;
    }

    location @web {
        proxy_pass http://pharminsight_web;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
    }
}
